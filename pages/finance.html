<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>الإدارة المالية • Manager App</title>
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('managerapp:theme'));
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/tables.css" />
</head>
<body data-page="finance" class="is-subpage">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
      <div class="sidebar__brand">
        <span class="brand__logo">M</span>
        <span class="brand__text">
          <strong>Manager App</strong>
          <small>نظام الإدارة الشامل</small>
        </span>
      </div>
      <nav class="sidebar__nav" id="sidebarNav"></nav>
      <div class="sidebar__footer">
        <div class="storage-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
          </svg>
          <span>البيانات محفوظة محلياً على هذا الجهاز</span>
        </div>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn icon-btn--menu" id="menuBtn" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar__title">
          <h1 id="pageTitle">الإدارة المالية</h1>
          <p id="pageSubtitle">مداخيل ومصاريف المنشأة</p>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي" title="تبديل الوضع الليلي">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
          <button type="button" class="logout-btn" id="logoutBtn" title="تسجيل الخروج">خروج</button>
          <div class="avatar" title="المدير">أ</div>
        </div>
      </header>
      <main class="content">

        <section class="page-head">
          <div>
            <h2>الإدارة المالية</h2>
            <p class="muted">تسجيل ومتابعة المداخيل والمصاريف</p>
          </div>
          <div class="page-head__actions">
            <button type="button" class="btn btn--primary" id="btnAddTx">+ عملية جديدة</button>
          </div>
        </section>

        <section class="stats">
          <div class="stat-card stat-card--success">
            <span class="stat-card__label">إجمالي المداخيل</span>
            <span class="stat-card__value" id="sumIncome">0 دج</span>
          </div>
          <div class="stat-card stat-card--danger">
            <span class="stat-card__label">إجمالي المصاريف</span>
            <span class="stat-card__value" id="sumExpense">0 دج</span>
          </div>
          <div class="stat-card stat-card--primary">
            <span class="stat-card__label">الصافي</span>
            <span class="stat-card__value" id="sumNet">0 دج</span>
          </div>
        </section>

        <section class="card">
          <div class="table-toolbar">
            <div class="filters">
              <select class="select" id="filterType">
                <option value="all">الكل</option>
                <option value="in">مداخيل</option>
                <option value="out">مصاريف</option>
              </select>
              <input class="input" type="search" id="searchTx" placeholder="بحث..." />
            </div>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>النوع</th>
                  <th>البيان</th>
                  <th>التصنيف</th>
                  <th>التاريخ</th>
                  <th class="t-end">المبلغ</th>
                  <th class="t-end">إجراءات</th>
                </tr>
              </thead>
              <tbody id="txBody"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="txModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head">
        <h3 id="modalTitle">عملية جديدة</h3>
      </div>
      <div class="form-group">
        <label for="txType">النوع</label>
        <select class="select" id="txType">
          <option value="in">مدخول</option>
          <option value="out">مصروف</option>
        </select>
      </div>
      <div class="form-group">
        <label for="txDesc">البيان</label>
        <input class="input" id="txDesc" type="text" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="txCategory">التصنيف</label>
          <input class="input" id="txCategory" type="text" />
        </div>
        <div class="form-group">
          <label for="txAmount">المبلغ</label>
          <input class="input" id="txAmount" type="number" min="0" step="0.01" required />
        </div>
      </div>
      <div class="form-group">
        <label for="txDate">التاريخ</label>
        <input class="input" id="txDate" type="date" required />
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="btnCancelTx">إلغاء</button>
        <button type="button" class="btn btn--primary" id="btnSaveTx">حفظ</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/finance.js"></script>
</body>
</html>
