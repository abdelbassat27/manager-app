<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>الموارد البشرية • Manager App</title>
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('managerapp:theme'));
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/tables.css" />
</head>
<body data-page="hr" class="is-subpage">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
      <div class="sidebar__brand">
        <span class="brand__logo">M</span>
        <span class="brand__text">
          <strong>Manager App</strong>
          <small>نظام الإدارة الشامل</small>
        </span>
      </div>
      <nav class="sidebar__nav" id="sidebarNav"></nav>
      <div class="sidebar__footer">
        <div class="storage-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
          </svg>
          <span>البيانات محفوظة محلياً على هذا الجهاز</span>
        </div>
      </div>
    </aside>
    <div class="overlay" id="overlay"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn icon-btn--menu" id="menuBtn" aria-label="فتح القائمة" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <div class="topbar__title">
          <h1 id="pageTitle">الموارد البشرية</h1>
          <p id="pageSubtitle">إدارة العمال والرواتب</p>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي" title="تبديل الوضع الليلي">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
          <button type="button" class="logout-btn" id="logoutBtn" title="تسجيل الخروج">خروج</button>
          <div class="avatar" title="المدير">أ</div>
        </div>
      </header>
      <main class="content">

        <section class="page-head">
          <div>
            <h2>الموارد البشرية</h2>
            <p class="muted">إدارة العمال والرواتب</p>
          </div>
          <div class="page-head__actions">
            <button type="button" class="btn btn--primary" id="btnAddHr">+ إضافة عامل</button>
          </div>
        </section>
        <section class="stats">
          <div class="stat-card stat-card--info">
            <span class="stat-card__label">عدد العمال</span>
            <span class="stat-card__value" id="hrCount">0</span>
          </div>
          <div class="stat-card stat-card--primary">
            <span class="stat-card__label">إجمالي الرواتب</span>
            <span class="stat-card__value" id="hrSalary">0 دج</span>
          </div>
        </section>
        <section class="card">
          <div class="table-toolbar">
            <input class="input" type="search" id="searchHr" placeholder="بحث بالاسم أو المنصب..." style="max-width:260px" />
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>الاسم</th>
                  <th>المنصب</th>
                  <th class="t-end">الراتب</th>
                  <th>الهاتف</th>
                  <th class="t-end">إجراءات</th>
                </tr>
              </thead>
              <tbody id="hrBody"></tbody>
            </table>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="hrModal">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal__head"><h3 id="modalTitle">إضافة عامل</h3></div>
      <div class="form-group">
        <label for="wName">الاسم</label>
        <input class="input" id="wName" type="text" required />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="wPosition">المنصب</label>
          <input class="input" id="wPosition" type="text" />
        </div>
        <div class="form-group">
          <label for="wSalary">الراتب</label>
          <input class="input" id="wSalary" type="number" min="0" step="100" />
        </div>
      </div>
      <div class="form-group">
        <label for="wPhone">الهاتف</label>
        <input class="input" id="wPhone" type="tel" />
      </div>
      <div class="modal__actions">
        <button type="button" class="btn btn--ghost" id="btnCancelHr">إلغاء</button>
        <button type="button" class="btn btn--primary" id="btnSaveHr">حفظ</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/hr.js"></script>
</body>
</html>
